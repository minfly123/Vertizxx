<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertizx - PiiZx</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#131c31', 900: '#0a0f1d' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Animasi Halus & Glassmorphism */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.35s ease-out forwards;
        }
        .glass-card {
            background: rgba(19, 28, 49, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- HEADER / NAVBAR -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50 transition-all">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5 cursor-pointer group">
                <div class="p-2 bg-gradient-to-br from-indigo-500 to-violet-600 rounded-xl text-white font-black tracking-wider shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition duration-300">V</div>
                <span class="text-xl font-black bg-gradient-to-r from-indigo-400 via-purple-300 to-cyan-400 bg-clip-text text-transparent">Vertizx</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleSupportModal(true)" class="flex items-center gap-1.5 px-4 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-700/80 hover:border-indigo-500/50 transition duration-300 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-500/10 group">
                    <i data-lucide="heart" class="w-4 h-4 text-rose-400 fill-rose-400 group-hover:scale-110 transition"></i>
                    <span class="text-slate-200">Support</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex items-center justify-center">
        
        <!-- WRAPPER UTAMA DENGAN ANIMASI -->
        <div class="glass-card border border-slate-800/80 p-6 md:p-8 rounded-3xl shadow-2xl shadow-indigo-950/20 w-full max-w-md animate-fade relative overflow-hidden">
            
            <!-- Efek Cahaya Ambient Background -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-6 relative z-10">
                <div class="inline-flex p-3 bg-gradient-to-tr from-indigo-500/20 to-violet-500/20 border border-indigo-500/30 text-indigo-400 rounded-2xl mb-3 shadow-inner">
                    <i data-lucide="sparkles" class="w-6 h-6 animate-pulse"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight">Alight Motion Premium</h2>
                <p class="text-slate-400 text-xs mt-1">Upgrade akun durasi 1 tahun secara instan & aman</p>
            </div>

            <!-- TAHAP 1: INPUT EMAIL & KIRIM LINK -->
            <div id="am-step-1" class="space-y-4 relative z-10 animate-fade">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Alight Motion</label>
                    <input type="email" id="am-email-input" placeholder="nama@email.com" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white transition duration-300">
                </div>
                <button onclick="sendAMLink()" id="btn-send-link" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:opacity-95 active:scale-[0.98] rounded-2xl font-bold text-sm transition duration-300 shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i> Kirim Magic Link
                </button>
            </div>

            <!-- TAHAP 2: MASUKKAN MAGIC LINK -->
            <div id="am-step-2" class="hidden space-y-4 relative z-10 animate-fade">
                <div class="p-3.5 bg-slate-950/60 rounded-2xl border border-slate-800 text-xs text-slate-300 flex items-center justify-between">
                    <span class="text-slate-400">Target:</span>
                    <span id="display-target-email" class="font-mono font-bold text-indigo-300 truncate max-w-[220px]"></span>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tempel Magic Link (Auto-Transform)</label>
                    <input type="text" id="am-magic-link-input" placeholder="https://alight-creative.firebaseapp.com/..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-xs font-mono focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white transition duration-300">
                </div>
                <button onclick="verifyAMLink()" id="btn-verify-link" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-95 active:scale-[0.98] rounded-2xl font-bold text-sm transition duration-300 shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i> Verifikasi & Upgrade
                </button>
                <div class="flex justify-between text-xs pt-1">
                    <button onclick="resetAMForm()" class="text-indigo-400 hover:text-indigo-300 transition flex items-center gap-1 font-medium">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Ganti Email
                    </button>
                </div>
            </div>
            
            <div id="am-status-msg" class="mt-4 text-xs p-3.5 rounded-2xl hidden animate-fade font-medium"></div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        © 2026 Vertizx. Dibuat dengan penuh ❤️ oleh PiiZx.
    </footer>

    <!-- MODAL SUPPORT DEVELOPER -->
    <div id="support-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 animate-fade">
        <div class="glass-card border border-slate-700/80 rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl shadow-indigo-950/50">
            <button onclick="toggleSupportModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-900/80 p-1.5 rounded-xl border border-slate-700 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div class="inline-flex p-3 bg-rose-500/10 text-rose-400 rounded-2xl border border-rose-500/20 mb-3 shadow-inner">
                <i data-lucide="heart" class="w-6 h-6 fill-rose-400"></i>
            </div>
            <h3 class="text-lg font-bold mb-1">Dukung Developer PiiZx</h3>
            <p class="text-slate-400 text-xs mb-4">Bantu donasi seikhlasnya agar website Vertizx terus update!</p>
            
            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 mb-4 space-y-1.5 shadow-inner">
                <div class="text-[11px] text-slate-400">Nomor E-Wallet (GoPay / DANA / OVO):</div>
                <div class="text-base font-mono font-bold text-indigo-300 select-all tracking-wide">0895351456586</div>
                <div class="text-[10px] text-slate-500">Atas Nama: PiiZx</div>
            </div>

            <button onclick="copyNumber()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/30">Salin Nomor</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC (100% AMAN & WORK) -->
    <script>
        try {
            lucide.createIcons();
        } catch(e) {}

        function toggleSupportModal(show) {
            const modal = document.getElementById('support-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function copyNumber() {
            navigator.clipboard.writeText('0895351456586');
            alert('Nomor e-wallet berhasil disalin!');
        }

        let userEmail = '';
        const WORKER_BASE = 'https://am.revlykurniawan.workers.dev';

        async function sendAMLink() {
            const emailInputEl = document.getElementById('am-email-input');
            const msgBox = document.getElementById('am-status-msg');
            const btn = document.getElementById('btn-send-link');

            if (!emailInputEl) return;
            const emailInput = emailInputEl.value.trim();

            if (!emailInput || !emailInput.includes('@')) {
                alert('Mohon masukkan email yang valid!');
                return;
            }

            userEmail = emailInput;
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Mengirim...';
            msgBox.classList.add('hidden');

            try {
                const res = await fetch(`${WORKER_BASE}/send-link`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });
                
                const textRes = await res.text();
                let data;
                try {
                    data = JSON.parse(textRes);
                } catch (e) {
                    data = { success: res.ok, message: textRes };
                }

                if (res.ok || data.success) {
                    document.getElementById('display-target-email').innerText = userEmail;
                    document.getElementById('am-step-1').classList.add('hidden');
                    document.getElementById('am-step-2').classList.remove('hidden');
                } else {
                    msgBox.className = 'mt-4 text-xs p-3.5 rounded-2xl bg-rose-950/80 text-rose-300 border border-rose-800 animate-fade';
                    msgBox.innerText = 'Gagal: ' + (data.message || 'Terjadi kesalahan pada server.');
                    msgBox.classList.remove('hidden');
                }
            } catch (err) {
                msgBox.className = 'mt-4 text-xs p-3.5 rounded-2xl bg-rose-950/80 text-rose-300 border border-rose-800 animate-fade';
                msgBox.innerText = 'Gagal koneksi: ' + err.message;
                msgBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Kirim Magic Link';
                lucide.createIcons();
            }
        }

        async function verifyAMLink() {
            let rawLink = document.getElementById('am-magic-link-input').value.trim();
            const msgBox = document.getElementById('am-status-msg');
            const btn = document.getElementById('btn-verify-link');

            if (!rawLink) {
                alert('Mohon tempel magic link terlebih dahulu!');
                return;
            }

            try {
                if (rawLink.includes('link=')) {
                    let splitIndex = rawLink.indexOf('link=');
                    let extracted = rawLink.substring(splitIndex + 5);
                    rawLink = decodeURIComponent(extracted);
                }
            } catch(e) {
                console.error("Gagal transform link otomatis:", e);
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Memverifikasi...';
            msgBox.classList.add('hidden');

            try {
                const res = await fetch(`${WORKER_BASE}/verify-link`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: userEmail, 
                        magicLink: rawLink 
                    })
                });
                
                const textRes = await res.text();
                let data;
                try {
                    data = JSON.parse(textRes);
                } catch (e) {
                    data = { success: res.ok, message: textRes };
                }

                if (res.ok || data.success) {
                    msgBox.className = 'mt-4 text-xs p-3.5 rounded-2xl bg-emerald-950/80 text-emerald-300 border border-emerald-800 animate-fade';
                    msgBox.innerText = '🎉 ' + (data.message || 'Sukses! Akun Alight Motion berhasil menjadi Premium.');
                    msgBox.classList.remove('hidden');
                } else {
                    msgBox.className = 'mt-4 text-xs p-3.5 rounded-2xl bg-rose-950/80 text-rose-300 border border-rose-800 animate-fade';
                    msgBox.innerText = 'Gagal: ' + (data.message || 'Link atau email tidak valid / kadaluarsa.');
                    msgBox.classList.remove('hidden');
                }
            } catch(err) {
                msgBox.className = 'mt-4 text-xs p-3.5 rounded-2xl bg-rose-950/80 text-rose-300 border border-rose-800 animate-fade';
                msgBox.innerText = 'Terjadi kesalahan jaringan: ' + err.message;
                msgBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="check-circle-2" class="w-4 h-4"></i> Verifikasi & Upgrade';
                lucide.createIcons();
            }
        }

        function resetAMForm() {
            document.getElementById('am-step-2').classList.add('hidden');
            document.getElementById('am-step-1').classList.remove('hidden');
            document.getElementById('am-status-msg').classList.add('hidden');
        }
    </script>
</body>
</html>
